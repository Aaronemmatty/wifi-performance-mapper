<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wi-Fi performance mapper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eef3;--panel:#fff;--soft:#f1f4f8;--line:#d6dee8;--tx:#13202d;--tx2:#5a6b7d;--acc:#0b6bcb;--accfg:#fff;--map:#f7f9fb;--room:#7f93a8;--cell:#f7f9fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d141b;--panel:#141d27;--soft:#1a2531;--line:#25323f;--tx:#e6edf5;--tx2:#8ea0b3;--acc:#5ab0ff;--accfg:#06233d;--map:#0f1822;--room:#5d7188;--cell:#0f1822}}
:root[data-theme="dark"]{--bg:#0d141b;--panel:#141d27;--soft:#1a2531;--line:#25323f;--tx:#e6edf5;--tx2:#8ea0b3;--acc:#5ab0ff;--accfg:#06233d;--map:#0f1822;--room:#5d7188;--cell:#0f1822}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
header{display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:500;font-size:16px;display:flex;align-items:center;gap:8px;margin-right:8px}
.seg{display:flex;background:var(--soft);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--tx2);padding:6px 12px;border-radius:6px;font:inherit;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--tx);box-shadow:0 0 0 1px var(--line)}
.sp{flex:1}
.chip{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;color:var(--tx2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--room)}
.dot.on{background:#2dd4a0}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--tx);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accfg);font-weight:500}
.btn.pri:hover{filter:brightness(1.08)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:0}
.stage{position:relative;padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px;overflow:auto}
.mapwrap{position:relative;background:var(--map);border:1px solid var(--line);border-radius:12px;padding:6px;width:100%;max-width:740px;height:min(440px,58vh);min-height:260px}
.stats,.legend{max-width:740px}
svg{display:block;width:100%;height:100%}
.stats{display:flex;gap:24px;align-items:baseline;flex-wrap:wrap}
.stats b{font-size:22px;font-weight:500}
.bar{flex:1;min-width:120px;height:6px;background:var(--soft);border-radius:3px;overflow:hidden;align-self:center}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--tx2);font-size:12px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
.empty{position:absolute;inset:10px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--map) 82%,transparent);border-radius:8px}
.empty div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 26px;max-width:340px;text-align:center}
.empty h2{margin:0 0 6px;font-size:18px;font-weight:500}
.empty p{margin:0 0 16px;color:var(--tx2)}
.empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
aside{background:var(--panel);border-left:1px solid var(--line);padding:18px;overflow:auto;display:flex;flex-direction:column;gap:16px}
aside h2{margin:0;font-size:18px;font-weight:500}
.sub{color:var(--tx2);font-size:12px}
.big{display:flex;align-items:baseline;gap:8px}
.big b{font-size:44px;line-height:1;font-weight:500}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid div{background:var(--soft);border-radius:8px;padding:10px 12px}
.grid small{display:block;color:var(--tx2);font-size:12px}
.grid strong{font-weight:500;font-size:16px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.hint{color:var(--tx2);font-size:12px;min-height:18px;margin-top:6px}
.hint.err{color:#e5484d}
.prog{height:4px;background:var(--soft);border-radius:2px;overflow:hidden;margin-top:8px;display:none}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .28s linear}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:820px){main{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
<div class="brand"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="1" fill="var(--acc)"/></svg>Wi-Fi mapper</div>
<div class="seg" role="group" aria-label="Floor"><button aria-pressed="true">Floor 1</button><button aria-pressed="false">Floor 2</button></div>
<div class="seg" id="metrics" role="group" aria-label="Heatmap metric"></div>
<div class="sp"></div>
<div class="chip"><span class="dot" id="sdot"></span><span id="sname">No active session</span></div>
<button class="btn pri" id="newbtn">New session</button>
</header>
<main>
<section class="stage">
<h1 class="sr">Floor 1 signal heatmap</h1>
<div class="mapwrap">
<svg id="map" viewBox="0 0 1000 600" role="img" aria-label="Floor 1 heatmap, 10 by 6 cells"></svg>
<div class="empty" id="empty"><div>
<h2>Start your first survey</h2>
<p>Create a session, then walk the floor and measure each cell. Signal quality fills in on the map as you go.</p>
<div class="row"><button class="btn pri" id="startbtn">Create session</button><button class="btn" id="demobtn">Load sample data</button></div>
</div></div>
</div>
<div class="stats"><span><b class="mono" id="pct">0%</b> <span class="sub" id="cov">0 of 60 cells</span></span><div class="bar"><i id="bar"></i></div><span class="sub"><span class="mono" id="rd">0</span> readings</span></div>
<div class="legend" id="legend"></div>
</section>
<aside>
<div><h2 id="ctitle">Faculty lounge</h2><div class="sub" id="csub"></div></div>
<div><div class="big"><b class="mono" id="val">—</b><span class="sub" id="unit"></span></div><span class="pill" id="qual" style="margin-top:8px"></span></div>
<div class="grid" id="grid"></div>
<div><button class="btn pri" id="measure" style="width:100%">Measure 5 samples</button><div class="prog" id="prog"><i id="progi"></i></div><div class="hint" id="hint"></div></div>
<div><div style="font-weight:500;margin-bottom:4px">History</div><ul class="hist" id="hist"></ul></div>
</aside>
</main>
<script>
const COLS=10,ROWS=6,S=100;
const AP=[[2.5,1.5],[5.5,3.5],[8,4.5]];
const rooms=[["Computer lab A",0,0,3,3],["Server room",3,0,2,3],["Computer lab B",5,0,3,3],["Faculty lounge",8,0,2,3],["Study hall",0,4,4,2],["Lecture auditorium",4,4,3,2],["Admin offices",7,4,3,2]];
const M={rssi:{l:"RSSI",u:"dBm",t:[-55,-65,-72,-80],inv:0},snr:{l:"SNR",u:"dB",t:[35,28,20,12],inv:0},lat:{l:"Latency",u:"ms",t:[15,30,50,80],inv:1},tp:{l:"Speed",u:"Mbps",t:[250,120,50,15],inv:0}};
const Q=[["Excellent","#2dd4a0","#04342c"],["Good","#9be15d","#173404"],["Fair","#f5c542","#412402"],["Weak","#f28c3a","#4a1b0c"],["Poor","#e5484d","#fff"]];
const st={session:null,data:{},sel:[2,7],metric:"rssi",busy:false};
const $=id=>document.getElementById(id);
const lvl=(k,v)=>{const m=M[k];for(let i=0;i<4;i++){if(m.inv?v<=m.t[i]:v>=m.t[i])return i}return 4};
const key=(r,c)=>r+"-"+c;
function sim(r,c){const d=Math.min(...AP.map(a=>Math.hypot(c+.5-a[0],r+.5-a[1])));const n=()=>Math.random()*4-2;const rssi=Math.round(-40-14*Math.pow(d,.9)+n());return{t:new Date(),rssi,snr:Math.round(rssi+96+n()),lat:Math.max(3,Math.round(8+(-rssi-40)*.9+n()*2)),tp:Math.max(4,Math.round(420*Math.exp(-d/2.3)+n()*6))}}
const avg=(a,k)=>Math.round(a.reduce((s,x)=>s+x[k],0)/a.length);
const roomAt=(r,c)=>rooms.find(a=>c>=a[1]&&c<a[1]+a[3]&&r>=a[2]&&r<a[2]+a[4]);
let svg='';
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){svg+=`<g class="cell" data-r="${r}" data-c="${c}" style="cursor:pointer"><rect x="${c*S+3}" y="${r*S+3}" width="${S-6}" height="${S-6}" rx="6" fill="var(--cell)" stroke="var(--line)" stroke-dasharray="5 5"/><text x="${c*S+S/2}" y="${r*S+S/2+8}" text-anchor="middle" font-size="22" class="mono" fill="#13202d" style="pointer-events:none"></text></g>`}
rooms.forEach(a=>{svg+=`<rect x="${a[1]*S+1}" y="${a[2]*S+1}" width="${a[3]*S-2}" height="${a[4]*S-2}" fill="none" stroke="var(--room)" stroke-width="2.5" style="pointer-events:none"/><text x="${a[1]*S+12}" y="${a[2]*S+24}" font-size="13" fill="var(--tx2)" style="pointer-events:none;paint-order:stroke;stroke:var(--map);stroke-width:4px">${a[0]}</text>`});
svg+=`<text x="600" y="${3*S+56}" text-anchor="middle" font-size="13" fill="var(--tx2)" letter-spacing="6" style="pointer-events:none">MAIN CORRIDOR</text>`;
AP.forEach(a=>{svg+=`<circle cx="${a[0]*S}" cy="${a[1]*S}" r="13" fill="var(--panel)" stroke="var(--tx)" stroke-width="3" style="pointer-events:none"/><circle cx="${a[0]*S}" cy="${a[1]*S}" r="4" fill="var(--tx)" style="pointer-events:none"/>`});
svg+=`<rect id="sel" width="${S-6}" height="${S-6}" rx="6" fill="none" stroke="var(--tx)" stroke-width="4" style="pointer-events:none"/>`;
$("map").innerHTML=svg;
$("metrics").innerHTML=Object.keys(M).map(k=>`<button data-k="${k}" aria-pressed="${k==="rssi"}">${M[k].l}</button>`).join("");
function render(){
const m=M[st.metric];let n=0,rd=0;
document.querySelectorAll(".cell").forEach(g=>{const k=key(g.dataset.r,g.dataset.c),a=st.data[k],rect=g.firstChild,tx=g.lastChild;
if(a&&a.length){n++;rd+=a.length;const v=avg(a,st.metric),q=Q[lvl(st.metric,v)];rect.setAttribute("fill",q[1]);rect.setAttribute("stroke","none");tx.textContent=v;tx.setAttribute("fill","#13202d")}
else{rect.setAttribute("fill","var(--cell)");rect.setAttribute("stroke","var(--line)");tx.textContent=""}});
$("pct").textContent=Math.round(n/60*100)+"%";$("cov").textContent=n+" of 60 cells";$("bar").style.width=(n/60*100)+"%";$("rd").textContent=rd;
$("empty").style.display=st.session?"none":"flex";
$("sname").textContent=st.session||"No active session";$("sdot").className="dot"+(st.session?" on":"");
const L=m.t,f=(i)=>i==0?(m.inv?"≤ "+L[0]:"≥ "+L[0]):i==4?(m.inv?"> "+L[3]:"< "+L[3]):(m.inv?L[i-1]+"–"+L[i]:L[i]+" to "+L[i-1]);
$("legend").innerHTML=Q.map((q,i)=>`<span><i style="background:${q[1]}"></i>${q[0]} <span class="mono">${f(i)}</span></span>`).join("")+`<span><i style="border:1px dashed var(--room)"></i>Unmeasured</span><span>${m.l} in ${m.u}</span>`;
const[r,c]=st.sel,a=st.data[key(r,c)],rm=roomAt(r,c);
$("sel").setAttribute("x",c*S+3);$("sel").setAttribute("y",r*S+3);
$("ctitle").textContent=rm?rm[0]:"Main corridor";$("csub").textContent="Row "+(r+1)+", column "+(c+1)+" · Floor 1";
const has=a&&a.length,v=has?avg(a,st.metric):null,q=has?Q[lvl(st.metric,v)]:null;
$("val").textContent=has?v:"—";$("unit").textContent=m.u;
const p=$("qual");p.textContent=has?q[0]:"Unmeasured";p.style.background=has?q[1]:"var(--soft)";p.style.color=has?q[2]:"var(--tx2)";
$("grid").innerHTML=Object.keys(M).map(k=>`<div><small>${M[k].l}</small><strong class="mono">${has?avg(a,k):"—"}</strong> <small style="display:inline">${has?M[k].u:""}</small></div>`).join("");
$("hist").innerHTML=has?a.slice().reverse().map(x=>`<li><span class="mono">${x.t.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"})}</span><span class="mono">${x.rssi} dBm · ${x.tp} Mbps</span></li>`).join(""):`<li style="color:var(--tx2);border:0;padding:0">No readings for this cell yet.</li>`;
document.querySelectorAll("#metrics button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===st.metric));
}
function startSession(){st.session="Survey · "+new Date().toLocaleString([],{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});st.data={};$("hint").textContent="";render()}
$("startbtn").onclick=startSession;$("newbtn").onclick=startSession;
$("demobtn").onclick=()=>{startSession();for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(Math.random()<.78){st.data[key(r,c)]=[sim(r,c),sim(r,c)]}}render()};
$("map").onclick=e=>{const g=e.target.closest(".cell");if(g){st.sel=[+g.dataset.r,+g.dataset.c];render()}};
$("metrics").onclick=e=>{const b=e.target.closest("button");if(b){st.metric=b.dataset.k;render()}};
function measure(){const h=$("hint");
if(!st.session){h.className="hint err";h.textContent="Create a session first, then measure.";return}
if(st.busy)return;st.busy=true;h.className="hint";$("prog").style.display="block";const b=$("measure"),pi=$("progi");let i=0;pi.style.width="0";
const iv=setInterval(()=>{i++;pi.style.width=(i*20)+"%";h.textContent="Sampling "+i+" of 5…";
if(i==5){clearInterval(iv);const[r,c]=st.sel,k=key(r,c);(st.data[k]=st.data[k]||[]).push(sim(r,c));st.busy=false;$("prog").style.display="none";h.textContent="Reading saved";render()}},300)}
$("measure").onclick=measure;
document.addEventListener("keydown",e=>{const d={ArrowLeft:[0,-1],ArrowRight:[0,1],ArrowUp:[-1,0],ArrowDown:[1,0]}[e.key];
if(d){e.preventDefault();st.sel=[Math.min(ROWS-1,Math.max(0,st.sel[0]+d[0])),Math.min(COLS-1,Math.max(0,st.sel[1]+d[1]))];render()}
else if(e.key==="m"||e.key==="M")measure()});
render();
</script>
</body>
</html>
