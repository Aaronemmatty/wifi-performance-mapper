[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-performance-mapper"
version = "0.1.0"
description = "Grid-Based Wi-Fi Performance Mapping and Monitoring System"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Project Team" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
